<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Admin Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#6366f1',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #030014; color: #fff; }
    .glass-panel {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
    }
    input, textarea {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      width: 100%;
      margin-bottom: 1rem;
    }
    input:focus, textarea:focus { outline: none; border-color: #6366f1; }
    button.btn-primary {
      background: linear-gradient(45deg, #6366f1, #a855f7);
      padding: 0.5rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: bold;
      transition: all 0.3s;
    }
    button.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    button.btn-danger {
      background: #ef4444; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: bold; transition: all 0.3s;
    }
    button.btn-danger:hover { opacity: 0.9; }
    table { width: 100%; text-align: left; border-collapse: collapse; }
    th, td { padding: 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    th { background: rgba(255, 255, 255, 0.02); }
  </style>
</head>
<body class="min-h-screen p-8">

  <div id="app" class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Admin Dashboard</h1>
    </div>

    <div class="flex space-x-4 mb-8">
      <button onclick="showTab('projects')" id="tab-projects" class="btn-primary">Projects</button>
      <button onclick="showTab('certificates')" id="tab-certificates" class="glass-panel px-6 py-2 hover:bg-white/10 transition">Certificates</button>
    </div>

    <!-- Projects Section -->
    <div id="section-projects" class="glass-panel p-6 mb-8">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Manage Projects</h2>
        <button onclick="openProjectModal()" class="btn-primary"><i class="fa-solid fa-plus mr-2"></i> Add Project</button>
      </div>
      <div class="overflow-x-auto">
        <table>
          <thead>
            <tr>
              <th>Image</th>
              <th>Title</th>
              <th>Tech Stack</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="projects-table-body">
            <!-- Rendered via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Certificates Section -->
    <div id="section-certificates" class="glass-panel p-6 mb-8 hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Manage Certificates</h2>
        <button onclick="openCertificateModal()" class="btn-primary"><i class="fa-solid fa-plus mr-2"></i> Add Certificate</button>
      </div>
      <div class="overflow-x-auto">
        <table>
          <thead>
            <tr>
              <th>Image</th>
              <th>Created At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="certificates-table-body">
            <!-- Rendered via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>



  <!-- Project Form Modal -->
  <div id="project-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden overflow-y-auto py-10">
    <div class="glass-panel p-8 w-full max-w-2xl my-auto">
      <div class="flex justify-between items-center mb-6">
        <h2 id="project-modal-title" class="text-2xl font-bold">Add Project</h2>
        <button onclick="closeModal('project-modal')" class="text-gray-400 hover:text-white"><i class="fa-solid fa-times text-xl"></i></button>
      </div>
      
      <input type="hidden" id="proj-id">
      
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-sm text-gray-300">Title</label>
          <input type="text" id="proj-title" placeholder="Project Name">
        </div>
        <div>
          <label class="text-sm text-gray-300">Image (Upload or URL)</label>
          <input type="file" id="proj-img-file" class="text-sm mb-2" accept="image/*" style="padding: 0; background: transparent; border: none;">
          <input type="text" id="proj-img" placeholder="Or URL https://...">
        </div>
        <div>
          <label class="text-sm text-gray-300">Live Link</label>
          <input type="text" id="proj-link" placeholder="https://...">
        </div>
        <div>
          <label class="text-sm text-gray-300">Github Link</label>
          <input type="text" id="proj-github" placeholder="https://github.com/...">
        </div>
      </div>
      
      <label class="text-sm text-gray-300">Description</label>
      <textarea id="proj-desc" rows="3" placeholder="Brief description..."></textarea>
      
      <label class="text-sm text-gray-300">Tech Stack (comma separated)</label>
      <input type="text" id="proj-tech" placeholder="React, Tailwind, Node.js">
      
      <label class="text-sm text-gray-300">Features (comma separated)</label>
      <input type="text" id="proj-features" placeholder="User Auth, Dark Mode, Responsive">
      
      <button onclick="saveProject()" class="btn-primary w-full mt-4">Save Project</button>
    </div>
  </div>

  <!-- Certificate Form Modal -->
  <div id="certificate-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden">
    <div class="glass-panel p-8 w-full max-w-md">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Add Certificate</h2>
        <button onclick="closeModal('certificate-modal')" class="text-gray-400 hover:text-white"><i class="fa-solid fa-times text-xl"></i></button>
      </div>
      
      <label class="text-sm text-gray-300">Image (Upload or URL)</label>
      <input type="file" id="cert-img-file" class="text-sm mb-2" accept="image/*" style="padding: 0; background: transparent; border: none;">
      <input type="text" id="cert-img" placeholder="Or URL https://...">
      
      <button onclick="saveCertificate()" class="btn-primary w-full mt-4">Save Certificate</button>
    </div>
  </div>

  <script>
    let supabaseClient = null;
    let projects = [];
    let certificates = [];

    // Initialize
    window.onload = () => {
      let envUrl = "%VITE_SUPABASE_URL%";
      let envKey = "%VITE_SUPABASE_ANON_KEY%";

      if (!envUrl || envUrl.includes('%VITE')) {
        Toast.fire({ icon: 'error', title: 'Supabase URL missing in .env' });
        return;
      }
      if (!envKey || envKey.includes('%VITE')) {
        Toast.fire({ icon: 'error', title: 'Supabase Key missing in .env' });
        return;
      }

      supabaseClient = window.supabase.createClient(envUrl, envKey);
      fetchData();
    };

    // UI Helpers
    function showTab(tab) {
      document.getElementById('section-projects').classList.add('hidden');
      document.getElementById('section-certificates').classList.add('hidden');
      document.getElementById('section-' + tab).classList.remove('hidden');
      
      document.getElementById('tab-projects').className = tab === 'projects' ? 'btn-primary' : 'glass-panel px-6 py-2 hover:bg-white/10 transition';
      document.getElementById('tab-certificates').className = tab === 'certificates' ? 'btn-primary' : 'glass-panel px-6 py-2 hover:bg-white/10 transition';
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // Toast
    const Toast = Swal.mixin({
      toast: true,
      position: 'top-end',
      showConfirmButton: false,
      timer: 3000,
      background: '#1e1b4b',
      color: '#fff'
    });

    // Fetch Data
    async function fetchData() {
      const { data: pData } = await supabaseClient.from('projects').select('*').order('created_at', { ascending: false });
      const { data: cData } = await supabaseClient.from('certificates').select('*').order('created_at', { ascending: false });
      
      projects = pData || [];
      certificates = cData || [];
      
      renderProjects();
      renderCertificates();
    }

    // Render Projects
    function renderProjects() {
      const tbody = document.getElementById('projects-table-body');
      tbody.innerHTML = projects.map(p => `
        <tr>
          <td><img src="${p.Img}" alt="img" class="w-16 h-12 object-cover rounded"></td>
          <td class="font-bold">${p.Title}</td>
          <td class="text-sm text-gray-400">${(p.TechStack || []).join(', ')}</td>
          <td>
            <button onclick="editProject('${p.id}')" class="text-blue-400 hover:text-blue-300 mr-3"><i class="fa-solid fa-edit"></i></button>
            <button onclick="deleteProject('${p.id}')" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    // Render Certificates
    function renderCertificates() {
      const tbody = document.getElementById('certificates-table-body');
      tbody.innerHTML = certificates.map(c => `
        <tr>
          <td><img src="${c.Img}" alt="img" class="w-24 object-cover rounded border border-white/10"></td>
          <td class="text-sm text-gray-400">${new Date(c.created_at || Date.now()).toLocaleDateString()}</td>
          <td>
            <button onclick="deleteCertificate('${c.id}')" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    // Projects CRUD
    function openProjectModal(id = null) {
      if (id) {
        const p = projects.find(x => x.id === id);
        document.getElementById('proj-id').value = p.id;
        document.getElementById('proj-title').value = p.Title;
        document.getElementById('proj-img').value = p.Img;
        document.getElementById('proj-link').value = p.Link;
        document.getElementById('proj-github').value = p.Github;
        document.getElementById('proj-desc').value = p.Description;
        document.getElementById('proj-tech').value = (p.TechStack || []).join(', ');
        document.getElementById('proj-features').value = (p.Features || []).join(', ');
        document.getElementById('project-modal-title').innerText = 'Edit Project';
      } else {
        document.getElementById('proj-id').value = '';
        document.getElementById('proj-title').value = '';
        document.getElementById('proj-img').value = '';
        document.getElementById('proj-link').value = '';
        document.getElementById('proj-github').value = '';
        document.getElementById('proj-desc').value = '';
        document.getElementById('proj-tech').value = '';
        document.getElementById('proj-features').value = '';
        document.getElementById('project-modal-title').innerText = 'Add Project';
      }
      openModal('project-modal');
    }

    // Image Upload Helper
    async function uploadImage(file) {
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}-${Math.random().toString(36).substring(7)}.${fileExt}`;
      const filePath = `public/${fileName}`;

      const { error: uploadError } = await supabaseClient.storage.from('portfolio-images').upload(filePath, file);
      if (uploadError) throw uploadError;
      
      const { data } = supabaseClient.storage.from('portfolio-images').getPublicUrl(filePath);
      return data.publicUrl;
    }

    async function saveProject() {
      document.getElementById('project-modal').classList.add('opacity-50', 'pointer-events-none');
      let Img = document.getElementById('proj-img').value;
      const imgFile = document.getElementById('proj-img-file').files[0];

      try {
        if (imgFile) {
          Toast.fire({ icon: 'info', title: 'Uploading image...' });
          Img = await uploadImage(imgFile);
        }
      } catch (err) {
        document.getElementById('project-modal').classList.remove('opacity-50', 'pointer-events-none');
        return Toast.fire({ icon: 'error', title: 'Image Upload Failed: ' + err.message });
      }

      const id = document.getElementById('proj-id').value;
      const payload = {
        Title: document.getElementById('proj-title').value,
        Img: Img,
        Link: document.getElementById('proj-link').value,
        Github: document.getElementById('proj-github').value,
        Description: document.getElementById('proj-desc').value,
        TechStack: document.getElementById('proj-tech').value.split(',').map(s => s.trim()).filter(Boolean),
        Features: document.getElementById('proj-features').value.split(',').map(s => s.trim()).filter(Boolean),
      };

      let error;
      if (id) {
        const res = await supabaseClient.from('projects').update(payload).eq('id', id);
        error = res.error;
      } else {
        const res = await supabaseClient.from('projects').insert([payload]);
        error = res.error;
      }

      document.getElementById('project-modal').classList.remove('opacity-50', 'pointer-events-none');

      if (error) {
        Toast.fire({ icon: 'error', title: error.message });
      } else {
        Toast.fire({ icon: 'success', title: 'Saved successfully' });
        closeModal('project-modal');
        document.getElementById('proj-img-file').value = '';
        fetchData();
      }
    }

    async function deleteProject(id) {
      if(confirm('Are you sure you want to delete this project?')) {
        const { error } = await supabaseClient.from('projects').delete().eq('id', id);
        if(error) Toast.fire({ icon: 'error', title: error.message });
        else { Toast.fire({ icon: 'success', title: 'Deleted' }); fetchData(); }
      }
    }

    // Certificates CRUD
    function openCertificateModal() {
      document.getElementById('cert-img').value = '';
      document.getElementById('cert-img-file').value = '';
      openModal('certificate-modal');
    }

    async function saveCertificate() {
      document.getElementById('certificate-modal').classList.add('opacity-50', 'pointer-events-none');
      let Img = document.getElementById('cert-img').value;
      const imgFile = document.getElementById('cert-img-file').files[0];

      try {
        if (imgFile) {
          Toast.fire({ icon: 'info', title: 'Uploading image...' });
          Img = await uploadImage(imgFile);
        }
      } catch (err) {
        document.getElementById('certificate-modal').classList.remove('opacity-50', 'pointer-events-none');
        return Toast.fire({ icon: 'error', title: 'Image Upload Failed: ' + err.message });
      }

      if (!Img) {
        document.getElementById('certificate-modal').classList.remove('opacity-50', 'pointer-events-none');
        return Toast.fire({ icon: 'error', title: 'Image URL or File is required' });
      }

      const { error } = await supabaseClient.from('certificates').insert([{ Img }]);
      
      document.getElementById('certificate-modal').classList.remove('opacity-50', 'pointer-events-none');

      if (error) {
        Toast.fire({ icon: 'error', title: error.message });
      } else {
        Toast.fire({ icon: 'success', title: 'Saved successfully' });
        closeModal('certificate-modal');
        fetchData();
      }
    }

    async function deleteCertificate(id) {
      if(confirm('Are you sure you want to delete this certificate?')) {
        const { error } = await supabaseClient.from('certificates').delete().eq('id', id);
        if(error) Toast.fire({ icon: 'error', title: error.message });
        else { Toast.fire({ icon: 'success', title: 'Deleted' }); fetchData(); }
      }
    }
  </script>
</body>
</html>
