[build]
  command = "npm install --legacy-peer-deps && CI=false npm run build"
  publish = "dist"

[[redirects]]
  from = "/project/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18.20.6"
  NPM_VERSION = "10.8.2"

[build.processing]
  skip_processing = true
